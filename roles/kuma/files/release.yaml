apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tavros
  namespace: kuma-system
spec:
  releaseName: kuma
  chart:
    spec:
      chart: kuma
      sourceRef:
        kind: HelmRepository
        name: kuma
        namespace: flux-system
      # https://github.com/kumahq/kuma/blob/2.13.5/deployments/charts/kuma/values.yaml
      version: 2.13.5
  interval: 30m
  install:
    remediation:
      retries: 3
